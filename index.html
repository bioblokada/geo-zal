<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Геометрия: Зал</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
  /* Layout: a gym app — home with trophy road + ranks, then one training per screen */
  :root {
    --bg: #f3f4fa; --card: #ffffff; --fg: #141829; --muted: #6b7190; --line: #dfe2ef;
    --accent: #ff5a1f; --accent-soft: #ffe7dc; --accent2: #2b55e6; --accent2-soft: #e3e9ff;
    --ok: #1d8f5f; --ok-soft: #dcf5e9; --bad: #cf3f36; --bad-soft: #fde3e0; --warn: #d9a300; --warn-soft: #fff1c7;
    --gold: #e0a400; --display: "Unbounded", "Arial Black", sans-serif; --body: "Golos Text", "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0e1120; --card: #181c30; --fg: #eef0f8; --muted: #9ba3c4; --line: #2a3050;
    --accent: #ff7a45; --accent-soft: #4a2414; --accent2: #7290ff; --accent2-soft: #21305f;
    --ok: #4fcf93; --ok-soft: #173d2d; --bad: #ff7a70; --bad-soft: #4a1f1c; --warn: #ffc83d; --warn-soft: #4a3b12; --gold: #ffc83d; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0e1120; --card: #181c30; --fg: #eef0f8; --muted: #9ba3c4; --line: #2a3050;
    --accent: #ff7a45; --accent-soft: #4a2414; --accent2: #7290ff; --accent2-soft: #21305f;
    --ok: #4fcf93; --ok-soft: #173d2d; --bad: #ff7a70; --bad-soft: #4a1f1c; --warn: #ffc83d; --warn-soft: #4a3b12; --gold: #ffc83d; color-scheme: dark; }
  :root[data-skin="mint"] { --accent: #11a683; --accent-soft: #d6f4ea; }
  :root[data-skin="violet"] { --accent: #7b3fe4; --accent-soft: #ebe0ff; }
  :root[data-skin="pink"] { --accent: #e5327a; --accent-soft: #ffe0ec; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5; padding-inline: 16px; padding-block: 18px; }
  .wrap { max-width: 700px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
  h1 { font-size: 1.5rem; } h2 { font-size: 1.1rem; } h3 { font-size: .95rem; }
  p { margin: 0; }
  .eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .stack { display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .between { justify-content: space-between; }
  .stat { display: grid; gap: 2px; }
  .stat .num { font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat .lbl { font-size: .75rem; color: var(--muted); }
  .flame { color: var(--accent); }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=text] { font: inherit; font-size: 1.1rem; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); width: 190px; max-width: 100%; }
  input[type=text]:focus { outline: 2px solid var(--accent2); border-color: var(--accent2); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; background: var(--accent2-soft); color: var(--accent2); }
  .chip.hot { background: var(--accent-soft); color: var(--accent); }
  .chip.gold { background: var(--warn-soft); color: var(--gold); }
  /* trophy road */
  .road { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .road::before { content: ""; position: absolute; left: 10%; right: 10%; top: 22px; height: 4px; background: var(--line); border-radius: 2px; }
  .road .fill { position: absolute; left: 10%; top: 22px; height: 4px; background: var(--accent); border-radius: 2px; transition: width .5s; }
  .chest { position: relative; display: grid; justify-items: center; gap: 4px; text-align: center; font-size: .72rem; color: var(--muted); }
  .chest .box { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; font-family: var(--display); font-size: .7rem; font-weight: 700; }
  .chest.open .box { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chest.next .box { border-color: var(--accent); color: var(--accent); }
  /* ranks */
  .ranks { display: grid; gap: 8px; }
  .rank { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 14px; }
  .rank .bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .rank .bar > div { height: 100%; background: var(--accent2); transition: width .5s; }
  .rank .name { font-weight: 600; font-size: .95rem; }
  .tier { font-weight: 800; font-size: .8rem; letter-spacing: .03em; text-transform: uppercase; }
  .t0 { color: #a06a3a; } .t1 { color: #8a92ad; } .t2 { color: var(--gold); } .t3 { color: #2bb0d6; } .t4 { color: #c238d8; }
  /* week */
  .week { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
  .day { padding: 12px; border-radius: 14px; border: 1.5px solid var(--line); display: grid; gap: 6px; cursor: pointer; background: var(--card); text-align: left; }
  .day.done { border-color: var(--ok); background: var(--ok-soft); }
  .day.cur { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .day.locked { opacity: .5; cursor: default; }
  .day .n { font-family: var(--display); font-size: .75rem; }
  .day .t { font-size: .85rem; font-weight: 600; line-height: 1.25; }
  .day.boss { border-style: dashed; }
  /* training */
  .phase { display: flex; gap: 6px; }
  .phase span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .phase span.on { background: var(--accent); } .phase span.done { background: var(--ok); }
  .task { font-size: 1.1rem; line-height: 1.55; }
  .choices { display: grid; gap: 8px; } .choices button { text-align: left; }
  .choices button.picked { border-color: var(--accent2); background: var(--accent2-soft); }
  .hint { background: var(--warn-soft); border-radius: 12px; padding: 12px 14px; font-size: .95rem; }
  .verdict { border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; }
  .verdict.ok { background: var(--ok-soft); } .verdict.bad { background: var(--bad-soft); }
  .verdict .title { font-weight: 800; } .verdict.ok .title { color: var(--ok); } .verdict.bad .title { color: var(--bad); }
  .solution { white-space: pre-line; font-size: .97rem; }
  .plus { font-family: var(--display); color: var(--accent); font-weight: 700; animation: pop .5s ease-out; display: inline-block; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0 } 60% { transform: scale(1.2) } 100% { transform: scale(1); opacity: 1 } }
  .lesson { display: grid; gap: 14px; }
  .lesson p { font-size: 1.02rem; }
  .lesson .key { background: var(--accent2-soft); border-left: 4px solid var(--accent2); padding: 10px 14px; border-radius: 0 12px 12px 0; font-weight: 600; }
  .fig { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
  .fig svg { width: 100%; height: auto; display: block; touch-action: none; }
  .vals { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .val { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: .9rem; font-variant-numeric: tabular-nums; }
  .val b { font-family: var(--display); font-size: .95rem; display: block; }
  .c-opp { color: #e23b3b; } .c-adj { color: #2b6fe6; } .c-hyp { color: #1d9a5f; }
  .steps { display: grid; gap: 8px; }
  .step { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; gap: 2px; }
  .step .ex { font-family: var(--display); font-size: 1rem; }
  .step .why { font-size: .88rem; color: var(--muted); }
  .step.now { border-color: var(--accent); }
  .small { font-size: .88rem; color: var(--muted); }
  .timer { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--accent); }
  .big { font-family: var(--display); font-size: 2.4rem; line-height: 1; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); font-size: .85rem; font-weight: 600; }
  .badge.got { border-color: var(--accent); background: var(--accent-soft); }
  .skins { display: flex; gap: 8px; }
  .skin { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; }
  .skin.on { outline: 2px solid var(--fg); outline-offset: 2px; }
  .skin:disabled { opacity: .3; cursor: default; }
  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: center; font-size: .95rem; }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .plus { animation: none } .rank .bar > div, .road .fill { transition: none } }
  body { margin: 0; }
  textarea.code { width: 100%; min-height: 90px; font: inherit; font-size: .85rem; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); word-break: break-all; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap stack" id="app"></div>

<script>
/* ---------- content ---------- */
const TOPICS = {
  pyth: "Теорема Пифагора", area: "Площади", rtrig: "Тригонометрия прямоугольного треугольника",
  sim: "Подобие и окружность", func: "Триг. функции (§1)", sine: "Теорема синусов (§2)", cos: "Теорема косинусов (§3)", alg: "Корни и дроби",
};
const TIERS = [["Бронза", 0], ["Серебро", 25], ["Золото", 60], ["Алмаз", 110], ["Мифик", 180]];
const CHESTS = [
  { at: 60, title: "Новичок зала", skin: null },
  { at: 150, title: "Рабочий вес", skin: "mint" },
  { at: 280, title: "Катет-мастер", skin: "violet" },
  { at: 430, title: "Гипотенуза", skin: "pink" },
  { at: 600, title: "PR по тригонометрии", skin: null },
];

const DAYS = [
  { n: 1, title: "Три стороны, три имени", topic: "rtrig",
    warm: [
      { q: "Катеты <b>3</b> и <b>4</b>. Гипотенуза?", a: 5 },
      { q: "sin 30° = ? (десятичной дробью)", a: 0.5 },
      { q: "Сторона треугольника 8, высота к ней 5. Площадь?", a: 20 },
    ],
    lesson: { fig: "tri", html: `
      <p>В прямоугольном треугольнике у каждого острого угла есть три стороны-соседа, и у каждой своё имя относительно <b>этого</b> угла. <span class="c-hyp"><b>Гипотенуза</b></span> — всегда самая длинная, напротив прямого угла. <span class="c-opp"><b>Противолежащий</b></span> катет — тот, что напротив угла. <span class="c-adj"><b>Прилежащий</b></span> — тот, что касается угла.</p>
      <p class="key">sin = противолежащий / гипотенуза &nbsp;·&nbsp; cos = прилежащий / гипотенуза &nbsp;·&nbsp; tg = противолежащий / прилежащий</p>
      <p>Запоминалка: <b>с</b>инус <b>с</b>мотрит напротив, <b>к</b>осинус <b>к</b>асается. Потяни точку B вверх-вниз — угол A меняется, и смотри, как меняются синус и косинус. Чем больше угол, тем больше синус и тем меньше косинус. Это не формулы, это картинка.</p>` },
    set: [
      { q: "Катеты равны <b>6</b> и <b>8</b>. Найди синус угла, лежащего напротив катета 6.", a: 0.6, h: "Сначала гипотенуза по Пифагору. Потом: напротив / гипотенуза.", s: "Гипотенуза √(36+64) = 10. sin = 6/10 = 0,6." },
      { q: "Катеты равны <b>5</b> и <b>12</b>. Найди косинус угла, лежащего напротив катета 5. Ответ запиши дробью, например 7/9.", a: 12/13, h: "Косинус — прилежащий к гипотенузе. Прилежащий к этому углу катет — 12.", s: "Гипотенуза 13 (тройка 5-12-13). cos = 12/13." },
      { q: "Гипотенуза <b>10</b>, катет <b>6</b>. Найди тангенс угла, лежащего напротив катета 6.", a: 0.75, h: "tg = противолежащий / прилежащий. Второй катет найди по Пифагору.", s: "Второй катет √(100−36) = 8. tg = 6/8 = 0,75." },
      { q: "Катеты равны <b>7</b> и <b>24</b>. Найди косинус угла, лежащего напротив катета 24.", a: 0.28, h: "Прилежащий к этому углу катет — 7. Гипотенуза — тройка 7-24-25.", s: "Гипотенуза 25. cos = 7/25 = 0,28." },
      { q: "В прямоугольном треугольнике sin A = <b>0,8</b>, гипотенуза равна <b>15</b>. Найди катет, лежащий напротив угла A.", a: 12, h: "sin A = противолежащий / гипотенуза, значит противолежащий = sin A · гипотенуза.", s: "Катет = 0,8 · 15 = 12.\nЭто главный приём: из определения выражаешь ту сторону, которую ищешь." },
    ],
    heavy: { q: "В треугольнике ABC угол C прямой, AB = <b>26</b>, cos A = <b>12/13</b>. Найди площадь треугольника.", a: 120, h: "cos A = AC/AB → AC. Потом BC по Пифагору, потом S = ½·AC·BC.", s: "AC = AB · cos A = 26 · 12/13 = 24.\nBC = √(26² − 24²) = √(676 − 576) = √100 = 10.\nS = ½ · 24 · 10 = 120.\nТри шага, каждый на своё правило: определение косинуса, Пифагор, площадь." },
  },
  { n: 2, title: "Пифагор и тройки", topic: "pyth",
    warm: [
      { q: "Катеты <b>3</b> и <b>4</b>. Синус угла напротив катета 4?", a: 0.8 },
      { q: "Гипотенуза <b>13</b>, катет <b>12</b>. Второй катет?", a: 5 },
      { q: "cos 60° = ?", a: 0.5 },
    ],
    lesson: { fig: "pyth", html: `
      <p>Теорема Пифагора — это про площади: квадрат на гипотенузе ровно равен двум квадратам на катетах. Подвигай ползунки и посмотри, как a² + b² всегда даёт c².</p>
      <p class="key">c² = a² + b² &nbsp;·&nbsp; катет² = гипотенуза² − другой катет²</p>
      <p>Пифагоровы тройки, которые стоит знать в лицо, чтобы не считать корни: <b>3-4-5</b>, <b>5-12-13</b>, <b>8-15-17</b>, <b>7-24-25</b>. И все их кратные: 6-8-10, 9-12-15, 10-24-26. Если в задаче два числа из тройки, третье можно писать сразу.</p>
      <p>Когда тройки нет, ответ остаётся с корнем: √2, √3, 2√5. Это нормальный ответ, не надо его бояться и не надо округлять, если не просят.</p>` },
    set: [
      { q: "Катеты <b>9</b> и <b>12</b>. Гипотенуза?", a: 15, h: "Это тройка 3-4-5, умноженная на 3.", s: "√(81 + 144) = √225 = 15. Или сразу: 3-4-5 × 3." },
      { q: "Гипотенуза <b>17</b>, катет <b>8</b>. Второй катет?", a: 15, h: "Катет² = 17² − 8².", s: "√(289 − 64) = √225 = 15. Тройка 8-15-17." },
      { q: "Катет <b>1</b>, гипотенуза <b>2</b>. Второй катет? Ответ до сотых.", a: 1.73, h: "√(4 − 1) = √3. √3 ≈ 1,732.", s: "√(2² − 1²) = √3 ≈ 1,73.\nЭтот треугольник ты ещё встретишь: это половина равностороннего, его углы 30° и 60°." },
      { q: "Диагональ квадрата со стороной <b>6</b>. Ответ до сотых.", a: 8.49, h: "Диагональ — гипотенуза с катетами 6 и 6.", s: "√(36 + 36) = √72 = 6√2 ≈ 8,49.\nДиагональ квадрата всегда сторона · √2." },
      { q: "Равнобедренный треугольник: боковые стороны <b>10</b>, основание <b>12</b>. Найди высоту к основанию.", a: 8, h: "Высота делит основание пополам: получается прямоугольный треугольник с гипотенузой 10 и катетом 6.", s: "Половина основания 6, гипотенуза 10 → высота √(100 − 36) = 8.\nТройка 6-8-10. Равнобедренный треугольник почти всегда решается через высоту к основанию." },
    ],
    heavy: { q: "Равнобедренный треугольник с боковой стороной <b>13</b> и основанием <b>10</b>. Найди синус угла при основании. Ответ дробью.", a: 12/13, h: "Проведи высоту к основанию: катет 5, гипотенуза 13. Синус угла при основании — высота / боковая сторона.", s: "Высота √(169 − 25) = 12.\nУгол при основании лежит в прямоугольном треугольнике с гипотенузой 13; напротив него — высота 12.\nsin = 12/13.\nВчерашние определения плюс сегодняшний Пифагор. Так и устроен весь курс: новое всегда стоит на старом." },
  },
  { n: 3, title: "Одно тождество на всё", topic: "rtrig",
    warm: [
      { q: "Катеты <b>8</b> и <b>15</b>. Гипотенуза?", a: 17 },
      { q: "tg 45° = ?", a: 1 },
      { q: "Гипотенуза <b>20</b>, катет напротив угла A равен <b>12</b>. sin A = ?", a: 0.6 },
    ],
    lesson: { fig: "circ", html: `
      <p>Возьми Пифагора a² + b² = c² и подели всё на c². Получится (a/c)² + (b/c)² = 1. А a/c и b/c — это синус и косинус одного и того же угла. Вот и всё тождество, оно просто Пифагор в другой одежде.</p>
      <p class="key">sin²α + cos²α = 1 &nbsp;·&nbsp; tg α = sin α / cos α</p>
      <p>На картинке гипотенуза равна 1. Тогда синус — это просто высота точки, а косинус — её сдвиг вправо. Потяни точку по дуге: два квадратика внизу всегда складываются в единицу.</p>
      <p>Приём для тангенса: если tg = 3/4, нарисуй треугольник с катетами 3 и 4. Гипотенуза 5, и синус с косинусом читаются с картинки. Без единой формулы.</p>` },
    set: [

/* ---------- state ---------- */
const KEY = "geo9-gym-v1";
const seedTopics = { pyth: 50, area: 25, rtrig: 15, sim: 20, func: 25, sine: 50, cos: 35, alg: 10 };
let S = load() || { trophies: 0, topics: { ...seedTopics }, streak: 0, lastDay: null, freezeWeek: null, days: {}, chests: [], skin: null, cur: null };
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }
function weekKey() { const d = new Date(); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function applySkin() { if (S.skin) document.documentElement.setAttribute("data-skin", S.skin); else document.documentElement.removeAttribute("data-skin"); }
function tierOf(v) { let t = 0; TIERS.forEach((x, i) => { if (v >= x[1]) t = i; }); return t; }
function parseNum(s) { s = String(s).trim().replace(",", ".").replace(/\s+/g, ""); if (!s) return NaN; if (/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)) { const [p, q] = s.split("/").map(Number); return p / q; } return Number(s); }
function addTrophies(n, topic) { S.trophies += n; if (topic) S.topics[topic] = (S.topics[topic] || 0) + n; }

const app = document.getElementById("app");
applySkin();

/* ---------- home ---------- */
function home() {

  const doneCount = Object.values(S.days).filter(d => d.done).length;
  const nextChest = CHESTS.find(c => !S.chests.includes(c.at));
  const roadMax = CHESTS[CHESTS.length - 1].at;
  const fillW = Math.min(80, 80 * S.trophies / roadMax);
  const road = CHESTS.map(c => `<div class="chest ${S.chests.includes(c.at) ? "open" : (nextChest && nextChest.at === c.at ? "next" : "")}">
      <div class="box">${S.chests.includes(c.at) ? "✓" : c.at}</div><div>${c.title}</div></div>`).join("");
  const ranks = Object.keys(TOPICS).map(k => {
    const v = S.topics[k] || 0, t = tierOf(v), next = TIERS[t + 1];
    const pct = next ? Math.min(100, 100 * (v - TIERS[t][1]) / (next[1] - TIERS[t][1])) : 100;
    return `<div class="rank"><div class="name">${TOPICS[k]}</div><div class="tier t${t}">${TIERS[t][0]} · ${v}</div><div class="bar"><div style="width:${pct}%"></div></div></div>`;
  }).join("");
  let firstOpen = DAYS.findIndex(d => !(S.days[d.n] && S.days[d.n].done));

    return `<button type="button" class="day ${done ? "done" : ""} ${i === firstOpen ? "cur" : ""} ${locked ? "locked" : ""} ${d.boss ? "boss" : ""}" data-day="${d.n}" ${locked ? "disabled" : ""}>
      <span class="n">${d.boss ? "БОСС" : "ДЕНЬ " + d.n}</span><span class="t">${d.title}</span>${done ? `<span class="small">+${S.days[d.n].trophies} кубков</span>` : `<span class="small">${d.boss ? "1 задача" : "~20 минут"}</span>`}</button>`;

  const skins = [["", "#ff5a1f"], ["mint", "#11a683"], ["violet", "#7b3fe4"], ["pink", "#e5327a"]].map(([k, col]) =>
    `<button type="button" class="skin ${(S.skin || "") === k ? "on" : ""}" data-skin="${k}" style="background:${col}" ${k && !skinsAvail.includes(k) ? "disabled" : ""} aria-label="тема ${k || 'стандарт'}"></button>`).join("");

  app.innerHTML = `
    <div class="row between">
      <div><p class="eyebrow">Геометрия 9 · неделя 1</p><h1>Зал</h1></div>
      <div class="row">
        <div class="stat"><div class="num">${S.trophies}</div><div class="lbl">кубков</div></div>

      </div>
    </div>
    <div class="card">
      <div class="row between"><h2>Дорога трофеев</h2>${nextChest ? `<span class="chip hot">до сундука ${nextChest.at - S.trophies}</span>` : `<span class="chip gold">все сундуки открыты</span>`}</div>
      <div class="road"><div class="fill" style="width:${fillW}%"></div>${road}</div>
    </div>
    <div class="card stack">
      <div class="row between"><h2>Тренировки</h2><span class="small">${doneCount} из ${DAYS.length}</span></div>
      <div class="week">${week}</div>
      <p class="small">Каждая тренировка: разминка на скорость, тема с живым чертёжом, подход из 5 задач и один рабочий вес. Серия держится, если тренироваться каждый день; один пропуск в неделю прощается.</p>
    </div>
    <div class="card stack">
      <h2>Ранги по темам</h2>
      <div class="ranks">${ranks}</div>
      <p class="small">Стартовые ранги — из диагностики. Бронза → Серебро → Золото → Алмаз → Мифик.</p>

    </div>
    <div class="card stack">
      <h2>Код прогресса</h2>
      <p class="small">Страховка от потери серии. Раз в несколько дней нажми «Показать код» и отправь его себе в сообщения. На другом компьютере вставь код в поле и нажми «Загрузить».</p>
      <div class="row"><button type="button" id="exp">Показать код</button><button type="button" class="ghost" id="imp">Загрузить код</button></div>

  const box = app.querySelector("#codebox"), msg = app.querySelector("#codemsg");
  app.querySelector("#exp").onclick = () => {
    const code = "GYM1." + btoa(unescape(encodeURIComponent(JSON.stringify({ trophies: S.trophies, topics: S.topics, streak: S.streak, lastDay: S.lastDay, freezeWeek: S.freezeWeek, days: S.days, chests: S.chests, skin: S.skin }))));

    const v = box.value.trim();
    if (!v.startsWith("GYM1.")) { msg.textContent = "Это не похоже на код прогресса."; return; }

      Object.assign(S, data, { cur: null }); save(); applySkin(); home();
    } catch (e) { msg.textContent = "Код повреждён, проверь, что скопирован целиком."; }

/* ---------- training ---------- */
function startDay(n) {
  const d = DAYS.find(x => x.n === n);
  S.cur = { day: n, phase: d.warm.length ? "warm" : "lesson", i: 0, ans: {}, hints: {}, earned: 0, warmStart: Date.now(), log: [] };
  save(); training();
}
const PHASES = ["warm", "lesson", "set", "heavy", "done"];
function training() {
  const c = S.cur, d = DAYS.find(x => x.n === c.day);
  const list = c.phase === "warm" ? d.warm : c.phase === "set" ? d.set : c.phase === "heavy" ? [d.heavy] : [];
  const pi = PHASES.indexOf(c.phase);
  const bar = PHASES.slice(0, 4).map((p, i) => `<span class="${i < pi ? "done" : i === pi ? "on" : ""}"></span>`).join("");
  const head = `<div class="row between"><div><p class="eyebrow">${d.boss ? "Босс" : "День " + d.n} · ${d.title}</p><h1>${{ warm: "Разминка", lesson: "Тема", set: "Подход", heavy: d.boss ? "Босс" : "Рабочий вес", done: "Готово" }[c.phase]}</h1></div>
    <div class="row"><span class="chip">+${c.earned}</span><button type="button" class="ghost" id="home">В зал</button></div></div><div class="phase">${bar}</div>`;

  if (c.phase === "lesson") {
    app.innerHTML = head + `<div class="card lesson" id="lesson">${d.lesson.html}${d.lesson.fig ? `<div class="fig" id="fig"></div>` : ""}</div>
      <div class="row"><button type="button" class="primary" id="go">${d.boss ? "К задаче" : "К подходу"}</button></div>`;
    if (d.lesson.fig) FIG[d.lesson.fig](document.getElementById("fig"));
    document.getElementById("go").onclick = () => { c.phase = d.set.length ? "set" : "heavy"; c.i = 0; save(); training(); window.scrollTo(0, 0); };
    document.getElementById("home").onclick = home;
    return;
  }
  if (c.phase === "done") return finish(d);

  const t = list[c.i], key = c.phase + c.i, ans = c.ans[key], answered = ans !== undefined;
  const warmTimer = c.phase === "warm" ? `<span class="timer" id="tm">0:00</span>` : "";
  let body, after = "";
  if (t.choices) {
    body = `<div class="choices" id="choices">` + t.choices.map((ch, k) => `<button type="button" data-k="${k}" class="${answered && ans.given === k ? "picked" : ""}" ${answered ? "disabled" : ""}>${ch}</button>`).join("") + `</div>`;
  } else {
    body = `<div class="row"><input type="text" id="ans" inputmode="decimal" placeholder="Ответ" value="${answered ? ans.text : ""}" ${answered ? "disabled" : ""} autocomplete="off">${answered ? "" : `<button type="button" class="primary" id="check">Проверить</button>`}</div>`;
  }
  if (!answered) {
    after = `<div class="row">${t.h && !c.hints[key] ? `<button type="button" class="ghost" id="hint">Подсказка (−5)</button>` : ""}${c.phase !== "warm" ? `<button type="button" class="ghost" id="skip">Не знаю, покажи решение</button>` : ""}</div>${c.hints[key] ? `<div class="hint">💡 ${t.h}</div>` : ""}`;
  } else {
    const last = c.i === list.length - 1;

    const ex = { 30: ["H/2", "H·√3/2"], 45: ["H/√2", "H/√2"], 60: ["H·√3/2", "H/2"] }[A];
    t(ox + w / 2, oy + 20, "прилежащий = " + ex[1].replace("H", H) + " = " + r2(adj), "#2b6fe6");
    t(ox + w + 8, oy - h / 2, ex[0].replace("H", H) + " = " + r2(opp), "#e23b3b", "start");
    box.querySelector("#lh").textContent = H;
    v.innerHTML = `<div class="val c-hyp">гипотенуза<b>${H}</b></div><div class="val c-opp">напротив ${A}°<b>${ex[0].replace("H", H)} ≈ ${r2(opp)}</b></div><div class="val c-adj">напротив ${90 - A}°<b>${ex[1].replace("H", H)} ≈ ${r2(adj)}</b></div>`;
  }
  box.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { A = +b.dataset.a; box.querySelectorAll("[data-a]").forEach(x => x.classList.toggle("primary", x === b)); upd(); });
  rh.oninput = upd; upd();
};

/* ---------- confetti ---------- */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#ff5a1f", "#2b55e6", "#1d8f5f", "#e0a400", "#e5327a"];
  const ps = Array.from({ length: 120 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * 200, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6.28 }));
  let t = 0; (function f() { ctx.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); }); if (++t < 150) requestAnimationFrame(f); else ctx.clearRect(0, 0, cv.width, cv.height); })();
}
